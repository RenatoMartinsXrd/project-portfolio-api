version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: project-portfolio-db
    environment:
      POSTGRES_DB: project_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - project_portfolio_data:/var/lib/postgresql/data

volumes:
  project_portfolio_data:
